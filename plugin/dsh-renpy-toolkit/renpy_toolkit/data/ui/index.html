<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ren'Py 汉化工具包</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --panel2:#22262f; --line:#2c3140;
    --text:#e6e9f0; --dim:#9aa3b5; --accent:#4f8cff; --accent2:#3ad29f;
    --warn:#ffb020; --err:#ff5d5d; --ok:#3ad29f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:14px 18px;
    background:linear-gradient(180deg,#1b1f29,#171a22);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .ver{color:var(--dim);font-size:12px}
  header .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{background:#2b3140;border-color:#3b435a}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#5f97ff}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
  .left{padding:16px 18px;overflow:auto;border-right:1px solid var(--line)}
  .right{display:flex;flex-direction:column;min-height:0;background:#0f1116}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
    letter-spacing:.6px;text-transform:uppercase}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input[type=text]{background:#0e1117;color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
  select{flex:1;min-width:240px}
  input[type=text]{width:130px}
  .games{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .game{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;background:#151922;transition:.15s}
  .game:hover{border-color:#3b435a;background:#1a1f2a}
  .game.active{border-color:var(--accent);background:#17233b;box-shadow:0 0 0 1px var(--accent) inset}
  .game .nm{font-weight:600}
  .game .pt{color:var(--dim);font-size:12px;word-break:break-all}
  .game .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#26303f;color:var(--dim);white-space:nowrap}
  .game .tag.ok{background:#123526;color:var(--ok)}
  .game .tag.no{background:#3a2020;color:var(--warn)}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
  .act{text-align:left;background:#151922;border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;cursor:pointer;transition:.15s}
  .act:hover{border-color:var(--accent);background:#17233b}
  .act:disabled{opacity:.5;cursor:not-allowed}
  .act .l{font-weight:600;margin-bottom:3px}
  .act .h{color:var(--dim);font-size:12px;line-height:1.4}
  .gtitle{grid-column:1/-1;color:var(--dim);font-size:12px;margin-top:6px;letter-spacing:.5px}
  .right header{background:#12151c;border-bottom:1px solid var(--line);padding:10px 14px;
    font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
  #log{flex:1;overflow:auto;margin:0;padding:12px 14px;
    font:12.5px/1.6 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word}
  #log .err{color:var(--err)}
  #log .warn{color:var(--warn)}
  #log .ok{color:var(--ok)}
  #log .cmd{color:#7fb0ff}
  #log .dim{color:#6b7488}
  .mask{position:fixed;inset:0;background:rgba(6,8,12,.72);display:none;
    align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .dialog{width:min(780px,92vw);max-height:82vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .dialog h3{margin:0;padding:15px 18px;font-size:15px;border-bottom:1px solid var(--line)}
  .dialog .body{padding:14px 18px;overflow:auto}
  .dialog pre{background:#0d1016;border:1px solid var(--line);border-radius:8px;padding:11px 13px;
    font:12.5px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:8px 0 0}
  .dialog .foot{display:flex;gap:10px;justify-content:flex-end;padding:13px 18px;
    border-top:1px solid var(--line)}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);
    max-width:min(760px,92vw);background:#3a1b1b;color:#ffd9d9;border:1px solid #7a3030;
    padding:11px 16px;border-radius:10px;display:none;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .toast.show{display:block}
  .empty{color:var(--dim);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:10px}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
    animation:p 1s infinite alternate}
  @keyframes p{to{opacity:.25}}
</style>
</head>
<body>
<header>
  <h1>Ren'Py 汉化工具包</h1>
  <span class="ver" id="ver"></span>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnOut">打开数据目录</button>
  <button class="btn ghost" id="btnGame">打开游戏目录</button>
</header>

<main>
  <div class="left">
    <div class="card">
      <h2>1 · 选择游戏</h2>
      <div class="row">
        <button class="btn" id="btnScan">重新扫描</button>
        <input type="text" id="manual" placeholder="或直接填游戏目录" style="flex:1;min-width:240px;width:auto">
        <button class="btn" id="btnUse">打开这个目录</button>
        <span id="scanInfo" class="ver"></span>
      </div>
      <div class="games" id="games"></div>
    </div>

    <div class="card">
      <h2>2 · 参数</h2>
      <div class="row">
        <label class="ver">目标语言</label>
        <input type="text" id="lang" value="chinese" spellcheck="false">
        <label class="ver">备份方式</label>
        <select id="backup" style="flex:0 0 auto;min-width:190px">
          <option value="bak">bak（复制到数据目录）</option>
          <option value="git">git（快照历史）</option>
          <option value="none">none（不备份）</option>
        </select>
        <span class="ver">导出与备份都落在数据目录，不写进游戏</span>
      </div>
    </div>

    <div class="card">
      <h2>3 · 操作</h2>
      <div class="groups" id="groups"></div>
    </div>
  </div>

  <div class="right">
    <header>
      <span class="pulse" id="busyDot" style="display:none"></span>
      <span id="logTitle">运行日志</span>
      <div style="flex:1"></div>
      <button class="btn ghost" id="btnClear" style="padding:3px 9px;font-size:12px">清空</button>
    </header>
    <pre id="log"></pre>
  </div>
</main>

<div class="mask" id="mask">
  <div class="dialog">
    <h3 id="dlgTitle">确认</h3>
    <div class="body">
      <div id="dlgText"></div>
      <pre id="dlgPre"></pre>
    </div>
    <div class="foot">
      <button class="btn" id="dlgNo">取消</button>
      <button class="btn primary" id="dlgYes">确认执行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { games: [], current: null, busy: false, logSeq: 0 };

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function push(line, cls) {
  const el = $('log');
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = line + '\n';
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 9000);
}

async function api(name, ...args) {
  const r = await fetch('/api/call', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, args }),
  });
  return await r.json();
}

// 日志由服务端缓冲，页面轮询增量——避免一次长命令把请求卡住。
async function pollLogs() {
  try {
    const r = await fetch('/api/logs?since=' + state.logSeq);
    const data = await r.json();
    (data.lines || []).forEach((it) => push(it.t, it.c));
    state.logSeq = data.next || state.logSeq;
  } catch (e) { /* 服务还没起来，下次再试 */ }
}
setInterval(pollLogs, 350);

function setBusy(b) {
  state.busy = b;
  $('busyDot').style.display = b ? 'inline-block' : 'none';
  document.querySelectorAll('.act').forEach((a) => { a.disabled = b; });
}

function renderGames() {
  const box = $('games');
  box.innerHTML = '';
  if (!state.games.length) {
    box.innerHTML = '<div class="empty">这个目录下没找到 Ren\'Py 游戏。在上面填游戏所在目录，或把一键包放到游戏旁边再扫描。</div>';
    return;
  }
  state.games.forEach((g) => {
    const d = document.createElement('div');
    d.className = 'game' + (state.current && state.current.root === g.root ? ' active' : '');
    const tag = g.launcher
      ? '<span class="tag ok">可生成骨架</span>'
      : '<span class="tag no">无启动脚本</span>';
    d.innerHTML = `<div style="flex:1;min-width:0"><div class="nm">${esc(g.name)}</div>
      <div class="pt">${esc(g.root)}</div></div>${tag}`;
    d.onclick = () => selectGame(g.root);
    box.appendChild(d);
  });
}

function renderActions(groups) {
  const box = $('groups');
  box.innerHTML = '';
  (groups || []).forEach((g) => {
    const h = document.createElement('div');
    h.className = 'gtitle';
    h.textContent = '— ' + g.group + ' —';
    box.appendChild(h);
    g.actions.forEach((a) => {
      const b = document.createElement('button');
      b.className = 'act';
      b.dataset.key = a.key;
      b.innerHTML = `<div class="l">${esc(a.label)}</div><div class="h">${esc(a.hint)}</div>`;
      b.onclick = () => runAction(a.key, a.label, false);
      box.appendChild(b);
    });
  });
}

function applyBoot(r) {
  if (r.error) { toast(r.error); return; }
  state.games = r.games || [];
  state.current = r.current || null;
  if (r.version) $('ver').textContent = 'v' + r.version;
  if (r.language) $('lang').value = r.language;
  if (r.backup_mode) $('backup').value = r.backup_mode;
  if (r.scan_info) $('scanInfo').textContent = r.scan_info;
  if (r.outdir) $('logTitle').textContent = '运行日志 · ' + r.outdir;
  renderGames();
  if (r.groups) renderActions(r.groups);
}

async function selectGame(path) {
  const r = await api('select', path);
  if (r.error) { toast(r.error); return; }
  applyBoot(r);
  push('已选择游戏：' + (r.current ? r.current.name : path), 'ok');
}

let pending = { key: null, label: '' };
function showConfirm(key, label, previewText, count, targets) {
  pending = { key, label };
  $('dlgTitle').textContent = '确认：' + label;
  $('dlgText').innerHTML = count
    ? `将写入 <b>${count}</b> 个目标：<br><span style="color:#9aa3b5">${esc((targets || []).join('  ·  '))}</span>`
    : '这条命令会修改文件。下面是预演结果：';
  $('dlgPre').textContent = previewText || '（预演没有输出）';
  $('mask').classList.add('show');
}

async function runAction(key, label, confirm) {
  if (state.busy) return;
  if (!state.current) { toast('先在上面选一个游戏。'); return; }
  setBusy(true);
  try {
    const r = await api('run_action', key, confirm);
    await pollLogs();
    if (r.need_confirm) {
      showConfirm(key, label, r.preview_text, r.write_count, r.write_targets);
    } else if (r.error) {
      toast(r.error);
      if (r.hint) push('提示：' + r.hint, 'warn');
    } else {
      push('✔ ' + label + '：' + (r.ok ? '完成' : '有问题') +
           '（退出码 ' + r.code + '）' + (r.hint ? ' — ' + r.hint : ''), r.ok ? 'ok' : 'warn');
    }
  } catch (e) {
    toast('界面异常：' + e);
  } finally {
    setBusy(false);
  }
}

$('dlgNo').onclick = () => { $('mask').classList.remove('show'); push('已取消。', 'dim'); };
$('dlgYes').onclick = () => {
  $('mask').classList.remove('show');
  if (pending.key) runAction(pending.key, pending.label, true);
};

$('btnScan').onclick = async () => { applyBoot(await api('rescan')); };
$('btnUse').onclick = async () => {
  const p = $('manual').value.trim();
  if (!p) { toast('先填一个目录，或者直接点下面的游戏卡片。'); return; }
  applyBoot(await api('scan', p));
};
$('manual').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnUse').click(); });
$('btnOut').onclick = () => api('open_outdir');
$('btnGame').onclick = () => api('open_game');
$('btnClear').onclick = () => { $('log').textContent = ''; };
$('lang').onchange = () => api('save_prefs', $('lang').value, $('backup').value);
$('backup').onchange = () => api('save_prefs', $('lang').value, $('backup').value);

(async function boot() {
  try {
    const r = await api('bootstrap');
    applyBoot(r);
    await pollLogs();
    push('就绪。先选游戏，再点操作。', 'dim');
    push('导出、备份、反编译结果都放在数据目录，不写进游戏；只有「生成汉化骨架」会写进 game\\tl\\<语言>。', 'dim');
  } catch (e) {
    toast('初始化失败：' + e);
  }
})();
</script>
</body>
</html>
