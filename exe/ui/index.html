<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ren'Py 汉化工具包</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef1f6; --line:#d5dbe4;
    --text:#1b1f27; --dim:#5a6371; --accent:#1f6feb; --accent2:#1a7f4b;
    --warn:#8a5300; --err:#b42318; --ok:#1a7f4b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
    background:#ffffff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.06)}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;color:#101828}
  header .ver{color:var(--dim);font-size:13px}
  header .spacer{flex:1}
  .btn{background:#ffffff;color:var(--text);border:1px solid #c7cfda;
    border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;transition:.15s}
  .btn:hover{background:#f2f6fd;border-color:#9fb4d6;color:#0f4c9c}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#1a5fd0;color:#fff}
  .btn.ghost{background:#ffffff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
  .left{padding:18px 20px;overflow:auto;border-right:1px solid var(--line)}
  .right{display:flex;flex-direction:column;min-height:0;background:#ffffff;border-left:1px solid var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h2{font-size:15px;margin:0 0 12px;color:#101828;font-weight:700;letter-spacing:.2px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input[type=text]{background:#ffffff;color:var(--text);border:1px solid #c7cfda;
    border-radius:8px;padding:9px 11px;font-size:14px;min-width:0}
  select:focus,input[type=text]:focus{outline:2px solid #bcd3f7;border-color:var(--accent)}
  select{flex:1;min-width:240px}
  input[type=text]{width:130px}
  .games{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .game{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;background:#fbfcfe;transition:.15s}
  .game:hover{border-color:#9fb4d6;background:#f4f8ff}
  .game.active{border-color:var(--accent);background:#eaf2ff;box-shadow:0 0 0 1px var(--accent) inset}
  .game .nm{font-weight:700;color:#101828}
  .game .pt{color:var(--dim);font-size:13px;word-break:break-all}
  .game .tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#eef1f6;color:#4a5464;white-space:nowrap}
  .game .tag.ok{background:#e3f6ec;color:var(--ok)}
  .game .tag.no{background:#fdf1e0;color:var(--warn)}
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:11px}
  .act{text-align:left;background:#ffffff;color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;cursor:pointer;transition:.15s;font-family:inherit}
  .act:hover{border-color:var(--accent);background:#f4f8ff}
  .act:disabled{opacity:.55;cursor:not-allowed;background:#f7f8fa}
  .act .l{font-weight:700;margin-bottom:3px;color:#101828;font-size:14px}
  .act .h{color:var(--dim);font-size:13px;line-height:1.45}
  .gtitle{grid-column:1/-1;color:#344054;font-size:14px;font-weight:700;margin-top:10px}
  .right header{background:#ffffff;border-bottom:1px solid var(--line);padding:11px 15px;
    font-size:13px;color:#344054;font-weight:600;display:flex;align-items:center;gap:8px}
  #log{flex:1;overflow:auto;margin:0;padding:13px 15px;background:#fbfcfe;color:#1b1f27;
    font:13px/1.65 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word}
  #log .err{color:var(--err)}
  #log .warn{color:var(--warn)}
  #log .ok{color:var(--ok)}
  #log .cmd{color:#0f4c9c;font-weight:600}
  #log .dim{color:#6b7480}
  .mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;
    align-items:center;justify-content:center;z-index:50}
  .mask.show{display:flex}
  .dialog{width:min(780px,92vw);max-height:82vh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 20px 60px rgba(16,24,40,.25)}
  .dialog h3{margin:0;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line);color:#101828}
  .dialog .body{padding:14px 18px;overflow:auto;color:var(--text)}
  .dialog pre{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    font:13px/1.65 Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:8px 0 0;color:#1b1f27}
  .dialog .foot{display:flex;gap:10px;justify-content:flex-end;padding:13px 18px;
    border-top:1px solid var(--line)}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);
    max-width:min(760px,92vw);background:#fdecea;color:#7a1c14;border:1px solid #f0b3ac;
    padding:12px 17px;border-radius:10px;display:none;z-index:60;box-shadow:0 12px 30px rgba(16,24,40,.18)}
  .toast.show{display:block}
  .empty{color:var(--dim);padding:18px;text-align:center;border:1px dashed #c7cfda;border-radius:10px;background:#fbfcfe}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);
    animation:p 1s infinite alternate}
  @keyframes p{to{opacity:.25}}
</style>
</head>
<body>
<header>
  <h1>Ren'Py 汉化工具包</h1>
  <span class="ver" id="ver"></span>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnOut">打开数据目录</button>
  <button class="btn ghost" id="btnGame">打开游戏目录</button>
</header>

<main>
  <div class="left">
    <div class="card">
      <h2>1 · 选择游戏</h2>
      <div class="row">
        <button class="btn" id="btnScan">重新扫描</button>
        <input type="text" id="manual" placeholder="或直接填游戏目录" style="flex:1;min-width:240px;width:auto">
        <button class="btn" id="btnUse">打开这个目录</button>
        <span id="scanInfo" class="ver"></span>
      </div>
      <div class="games" id="games"></div>
    </div>

    <div class="card">
      <h2>2 · 参数</h2>
      <div class="row">
        <label class="ver">目标语言</label>
        <input type="text" id="lang" value="chinese" spellcheck="false">
        <label class="ver">备份方式</label>
        <select id="backup" style="flex:0 0 auto;min-width:190px">
          <option value="bak">bak（复制到数据目录）</option>
          <option value="git">git（快照历史）</option>
          <option value="none">none（不备份）</option>
        </select>
        <span class="ver">导出与备份都落在数据目录，不写进游戏</span>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="ver">Excel 文件</label>
        <input type="text" id="xlsx" placeholder="回填译文用：留空则用「导出」目录里最新的 xlsx" spellcheck="false" style="flex:1;min-width:420px;width:auto">
        <button class="btn ghost" id="btnPickXlsx" style="flex:0 0 auto">用最新导出的</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="ver">旧译本目录</label>
        <input type="text" id="ref" placeholder="搬运旧译文用：填上一版 game\tl\chinese 的路径" spellcheck="false" style="flex:1;min-width:420px;width:auto">
        <span class="ver">只在这两个按钮需要</span>
      </div>
    </div>

    <div class="card">
      <h2>3 · 操作</h2>
      <div class="groups" id="groups"></div>
    </div>
  </div>

  <div class="right">
    <header>
      <span class="pulse" id="busyDot" style="display:none"></span>
      <span id="logTitle">运行日志</span>
      <div style="flex:1"></div>
      <button class="btn ghost" id="btnClear" style="padding:3px 9px;font-size:12px">清空</button>
    </header>
    <pre id="log"></pre>
  </div>
</main>

<div class="mask" id="mask">
  <div class="dialog">
    <h3 id="dlgTitle">确认</h3>
    <div class="body">
      <div id="dlgText"></div>
      <pre id="dlgPre"></pre>
    </div>
    <div class="foot">
      <button class="btn" id="dlgNo">取消</button>
      <button class="btn primary" id="dlgYes">确认执行</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { games: [], current: null, busy: false, logSeq: 0 };

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function push(line, cls) {
  const el = $('log');
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = line + '\n';
  el.appendChild(span);
  el.scrollTop = el.scrollHeight;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 9000);
}

async function api(name, ...args) {
  const r = await fetch('/api/call', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, args }),
  });
  return await r.json();
}

// 日志由服务端缓冲，页面轮询增量——避免一次长命令把请求卡住。
async function pollLogs() {
  try {
    const r = await fetch('/api/logs?since=' + state.logSeq);
    const data = await r.json();
    (data.lines || []).forEach((it) => push(it.t, it.c));
    state.logSeq = data.next || state.logSeq;
  } catch (e) { /* 服务还没起来，下次再试 */ }
}
setInterval(pollLogs, 350);

function setBusy(b) {
  state.busy = b;
  $('busyDot').style.display = b ? 'inline-block' : 'none';
  document.querySelectorAll('.act').forEach((a) => { a.disabled = b; });
}

function renderGames() {
  const box = $('games');
  box.innerHTML = '';
  if (!state.games.length) {
    box.innerHTML = '<div class="empty">这个目录下没找到 Ren\'Py 游戏。在上面填游戏所在目录，或把一键包放到游戏旁边再扫描。</div>';
    return;
  }
  state.games.forEach((g) => {
    const d = document.createElement('div');
    d.className = 'game' + (state.current && state.current.root === g.root ? ' active' : '');
    const tag = g.launcher
      ? '<span class="tag ok">可生成骨架</span>'
      : '<span class="tag no">无启动脚本</span>';
    d.innerHTML = `<div style="flex:1;min-width:0"><div class="nm">${esc(g.name)}</div>
      <div class="pt">${esc(g.root)}</div></div>${tag}`;
    d.onclick = () => selectGame(g.root);
    box.appendChild(d);
  });
}

function renderActions(groups) {
  const box = $('groups');
  box.innerHTML = '';
  (groups || []).forEach((g) => {
    const h = document.createElement('div');
    h.className = 'gtitle';
    h.textContent = '— ' + g.group + ' —';
    box.appendChild(h);
    g.actions.forEach((a) => {
      const b = document.createElement('button');
      b.className = 'act';
      b.dataset.key = a.key;
      b.innerHTML = `<div class="l">${esc(a.label)}</div><div class="h">${esc(a.hint)}</div>`;
      b.onclick = () => runAction(a.key, a.label, false);
      box.appendChild(b);
    });
  });
}

function applyBoot(r) {
  if (r.error) { toast(r.error); return; }
  state.games = r.games || [];
  state.current = r.current || null;
  if (r.version) $('ver').textContent = 'v' + r.version;
  if (r.language) $('lang').value = r.language;
  if (r.backup_mode) $('backup').value = r.backup_mode;
  if (r.scan_info) $('scanInfo').textContent = r.scan_info;
  if (r.outdir) $('logTitle').textContent = '运行日志 · ' + r.outdir;
  if (r.xlsx !== undefined) $('xlsx').value = r.xlsx || '';
  if (r.reference !== undefined) $('ref').value = r.reference || '';
  renderGames();
  if (r.groups) renderActions(r.groups);
}

async function selectGame(path) {
  const r = await api('select', path);
  if (r.error) { toast(r.error); return; }
  applyBoot(r);
  push('已选择游戏：' + (r.current ? r.current.name : path), 'ok');
}

let pending = { key: null, label: '' };
function showConfirm(key, label, previewText, count, targets) {
  pending = { key, label };
  $('dlgTitle').textContent = '确认：' + label;
  $('dlgText').innerHTML = count
    ? `将写入 <b>${count}</b> 个目标：<br><span style="color:#9aa3b5">${esc((targets || []).join('  ·  '))}</span>`
    : '这条命令会修改文件。下面是预演结果：';
  $('dlgPre').textContent = previewText || '（预演没有输出）';
  $('mask').classList.add('show');
}

async function runAction(key, label, confirm) {
  if (state.busy) return;
  if (!state.current) { toast('先在上面选一个游戏。'); return; }
  setBusy(true);
  try {
    const r = await api('run_action', key, confirm);
    await pollLogs();
    if (r.need_confirm) {
      showConfirm(key, label, r.preview_text, r.write_count, r.write_targets);
    } else if (r.error) {
      toast(r.error);
      if (r.hint) push('提示：' + r.hint, 'warn');
    } else {
      push('✔ ' + label + '：' + (r.ok ? '完成' : '有问题') +
           '（退出码 ' + r.code + '）' + (r.hint ? ' — ' + r.hint : ''), r.ok ? 'ok' : 'warn');
    }
  } catch (e) {
    toast('界面异常：' + e);
  } finally {
    setBusy(false);
  }
}

$('dlgNo').onclick = () => { $('mask').classList.remove('show'); push('已取消。', 'dim'); };
$('dlgYes').onclick = () => {
  $('mask').classList.remove('show');
  if (pending.key) runAction(pending.key, pending.label, true);
};

$('btnScan').onclick = async () => { applyBoot(await api('rescan')); };
$('btnUse').onclick = async () => {
  const p = $('manual').value.trim();
  if (!p) { toast('先填一个目录，或者直接点下面的游戏卡片。'); return; }
  applyBoot(await api('scan', p));
};
$('manual').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnUse').click(); });
$('btnOut').onclick = () => api('open_outdir');
$('btnGame').onclick = () => api('open_game');
$('btnClear').onclick = () => { $('log').textContent = ''; };
function savePrefs() {
  return api('save_prefs', $('lang').value, $('backup').value, $('xlsx').value, $('ref').value);
}
$('lang').onchange = savePrefs;
$('backup').onchange = savePrefs;
$('xlsx').onchange = savePrefs;
$('ref').onchange = savePrefs;
$('btnPickXlsx').onclick = async () => {
  const r = await api('suggest_xlsx');
  if (r.error) { toast(r.error); return; }
  if (!r.path) { toast(r.hint || '数据目录里还没有 xlsx。'); return; }
  $('xlsx').value = r.path;
  await savePrefs();
  push('已填入：' + r.path, 'dim');
};

(async function boot() {
  try {
    const r = await api('bootstrap');
    applyBoot(r);
    await pollLogs();
    push('就绪。先选游戏，再点操作。', 'dim');
    push('导出、备份、反编译结果都放在数据目录，不写进游戏；只有「生成汉化骨架」会写进 game\\tl\\<语言>。', 'dim');
  } catch (e) {
    toast('初始化失败：' + e);
  }
})();
</script>
</body>
</html>
